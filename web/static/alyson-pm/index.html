<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Alyson PM — Time Doctor, Notetaker, and Calendar in one place." />
    <title>Alyson PM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffb500'/%3E%3C/svg%3E" />
    <style>
      :root {
        --navy: #012272;
        --blue: #3872cd;
        --blue-soft: #e9effb;
        --text: #07074b;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card: #ffffff;
        --bg: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        color: var(--text);
        background: radial-gradient(ellipse 120% 80% at 50% -20%, var(--blue-soft), var(--bg));
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #ffb500;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(1, 34, 114, 0.12);
      }

      .logo svg {
        width: 32px;
        height: 32px;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--navy);
      }

      .tagline {
        margin: 4px 0 0;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .banner {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 32px;
        font-size: 0.875rem;
        color: var(--muted);
      }

      .banner strong {
        color: var(--text);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .card:hover {
        border-color: #c7d7f5;
        box-shadow: 0 8px 24px rgba(56, 114, 205, 0.12);
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--blue-soft);
        color: var(--blue);
        display: grid;
        place-items: center;
        font-size: 1.25rem;
      }

      .card h2 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--navy);
      }

      .card p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--muted);
        flex: 1;
      }

      .card a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }

      .card a:hover {
        background: var(--navy);
      }

      footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }

      footer a {
        color: var(--blue);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="#FFB500" />
            <path
              d="M12 14c0-3 4-5 8-5s8 2 8 5-2 4-5 6-5 6 2 6 5-1 8-4 10-6 8-4-3-6-4-8-2-2-4-1-6 1-4 4-2 6-3 2-6-1-8-4-10-6-8z"
              fill="#F5F5F5"
              opacity="0.9"
            />
          </svg>
        </div>
        <div>
          <h1>Alyson PM</h1>
          <p class="tagline">Productivity tools for your team</p>
        </div>
      </header>

      <p class="banner">
        <strong>Temporary landing page.</strong>
        Point your domain here until the full portal is ready. Set your app URL in
        <code>index.html</code> (<code>APP_BASE</code>) so buttons open Palisade.
      </p>

      <div class="grid" id="apps"></div>

      <footer>
        <p>&copy; <span id="year"></span> Alyson PM &middot; Temporary static page</p>
        <p>
          App base: <a id="base-display" href="#"></a>
        </p>
      </footer>
    </div>

    <script>
      // Change this when you attach a domain (no trailing slash)
      var APP_BASE = "http://localhost:3000";

      var APPS = [
        {
          id: "time-doctor",
          name: "Alyson Time Doctor",
          description: "Time tracking, activity monitoring, and team productivity insights.",
          path: "/timedoctor",
          icon: "\u23F1",
        },
        {
          id: "notetaker",
          name: "Alyson Notetaker",
          description: "Meeting notes, transcripts, and AI-assisted summaries.",
          path: "/dashboard/meetings/alyson-notetaker",
          icon: "\uD83D\uDCDD",
        },
        {
          id: "calendar",
          name: "Alyson Calendar",
          description: "Meeting calendar and session overview from your notetaker.",
          path: "/dashboard/meetings/meeting-calendar",
          icon: "\uD83D\uDCC5",
        },
      ];

      var base = APP_BASE.replace(/\/$/, "");
      document.getElementById("year").textContent = new Date().getFullYear();
      var baseLink = document.getElementById("base-display");
      baseLink.textContent = base;
      baseLink.href = base;

      var grid = document.getElementById("apps");
      APPS.forEach(function (app) {
        var card = document.createElement("article");
        card.className = "card";
        var iconEl = document.createElement("div");
        iconEl.className = "card-icon";
        iconEl.textContent = app.icon;
        var title = document.createElement("h2");
        title.textContent = app.name;
        var desc = document.createElement("p");
        desc.textContent = app.description;
        var link = document.createElement("a");
        link.href = base + app.path;
        link.textContent = "Open app";
        card.appendChild(iconEl);
        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(link);
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
