<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Alyson Time Doctor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffb500'/%3E%3C/svg%3E"
    />
    <script>
      // Change this to your site's default error page URL before deploying.
      var ERROR_PAGE_URL = "/error.html";

      var meta = document.createElement("meta");
      meta.httpEquiv = "refresh";
      meta.content = "0;url=" + ERROR_PAGE_URL;
      document.head.appendChild(meta);
    </script>
    <style>
      :root {
        --navy: #012272;
        --blue: #3872cd;
        --muted: #6b7280;
        --bg: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--navy);
        background: radial-gradient(ellipse 120% 80% at 50% -20%, #e9effb, var(--bg));
      }

      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 8px 24px rgba(1, 34, 114, 0.08);
      }

      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 12px;
        background: #ffb500;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 16px;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        color: var(--blue);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true"></div>
      <h1>Alyson Time Doctor</h1>
      <p>Redirecting you to the error page&hellip;</p>
      <p>
        If you are not redirected,
        <a id="manual-link" href="/error.html">continue here</a>.
      </p>
    </main>
    <script>
      (function () {
        var link = document.getElementById("manual-link");
        if (link) link.href = ERROR_PAGE_URL;
        window.location.replace(ERROR_PAGE_URL);
      })();
    </script>
  </body>
</html>
