name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.185)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# When MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD secrets are set, macOS builds are
# signed with that stable self-signed identity so TCC permissions persist across
# in-app updates. Without those secrets we fall back to unsigned (ad-hoc) builds.
env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      # Map secrets to env so the build step can branch without using secrets in `if:`.
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm ci --ignore-scripts

      - name: Prebuild macOS (env config, Swift helper, native modules)
        working-directory: desktop-agent
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDER: ${{ secrets.VITE_AUTH_PROVIDER }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: npm run prebuild:mac

      - name: Verify embedded config (macOS)
        working-directory: desktop-agent
        run: node scripts/verify-embedded-config.js

      # Import the stable self-signed .p12 so every release shares one TCC identity.
      # Generate with: desktop-agent/scripts/generate-stable-codesign-cert.sh
      - name: Import and trust stable macOS code-signing certificate
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/alyson-pm-codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/alyson-pm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PEM="$RUNNER_TEMP/alyson-pm-codesign.crt"
          echo -n "$MAC_CSC_LINK" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MAC_CSC_KEY_PASSWORD" \
            -A -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed -e 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Extract leaf cert and trust it system-wide so the identity becomes "valid"
          # (self-signed certs show CSSMERR_TP_NOT_TRUSTED until trusted).
          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
            -passin pass:"$MAC_CSC_KEY_PASSWORD" -out "$CERT_PEM" 2>/dev/null \
            || openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
              -passin pass:"$MAC_CSC_KEY_PASSWORD" -out "$CERT_PEM" -legacy
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$CERT_PEM"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "=== codesigning identities (valid) ==="
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q "Alyson PM Code Signing"; then
            echo "❌ Stable identity not trusted/available for codesign"
            security find-identity -p codesigning || true
            exit 1
          fi
          echo "✅ Stable code-signing certificate imported and trusted"

      - name: Build macOS (stable-signed when secrets present)
        working-directory: desktop-agent
        run: |
          set -euo pipefail
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            echo "🔏 Building macOS with stable self-signed identity (TCC-preserving)"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            # Do NOT set CSC_LINK — identity is already in the keychain.
            unset CSC_LINK CSC_KEY_PASSWORD || true
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            npx electron-builder --mac --publish never \
              -c.mac.identity="Alyson PM Code Signing" \
              -c.mac.notarize=false \
              -c.mac.hardenedRuntime=false
          else
            echo "⚠️ MAC_CSC_* secrets missing — building unsigned (permissions will reset on update)"
            npx electron-builder --mac --publish never \
              -c.mac.identity=null \
              -c.mac.notarize=false \
              -c.mac.hardenedRuntime=false
          fi

      - name: Verify macOS code signature
        working-directory: desktop-agent
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No .app found to verify"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "--- codesign -dv: $app ---"
            codesign -dv --verbose=2 "$app" 2>&1
            # Must NOT be ad-hoc if we intended stable signing
            if [ -n "${MAC_CSC_LINK:-}" ]; then
              info="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
              if echo "$info" | grep -qi 'Signature=adhoc'; then
                echo "❌ Expected stable signature but got ad-hoc"
                exit 1
              fi
              if ! echo "$info" | grep -qi 'Authority=Alyson PM Code Signing'; then
                echo "❌ Missing Authority=Alyson PM Code Signing"
                exit 1
              fi
              echo "✅ Stable signature confirmed for $app"
            fi
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            desktop-agent/dist/*.dmg
            desktop-agent/dist/*.zip
            desktop-agent/dist/latest-mac.yml
          retention-days: 7

  build-windows:
    name: Build Windows (unsigned test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install dependencies
        working-directory: desktop-agent
        run: npm ci --ignore-scripts

      # Force Windows sharp native binary into node_modules for electron-builder packing.
      # Dual-monitor stitch also has a System.Drawing fallback if sharp is absent at runtime.
      - name: Install sharp Windows native package
        working-directory: desktop-agent
        shell: bash
        run: |
          set +e
          npm install --no-save --ignore-scripts @img/sharp-win32-x64@0.34.5
          npm install --no-save --ignore-scripts --os=win32 --cpu=x64 sharp@0.34.5
          node -e "require('sharp'); console.log('sharp OK', process.platform, process.arch)"
          SHARP_OK=$?
          ls -d node_modules/@img/sharp-win32-* 2>/dev/null
          if [ "$SHARP_OK" -ne 0 ]; then
            echo "WARN: sharp failed to load — Windows build will rely on System.Drawing stitch fallback"
          fi
          set -e

      - name: Prebuild Windows (env config, Python bundle)
        working-directory: desktop-agent
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDER: ${{ secrets.VITE_AUTH_PROVIDER }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: npm run prebuild:win

      - name: Verify embedded config (Windows)
        working-directory: desktop-agent
        run: node scripts/verify-embedded-config.js

      - name: Build Windows (unsigned NSIS installer)
        working-directory: desktop-agent
        run: npx electron-builder --win --publish never --config.npmRebuild=false

      # Best-effort: confirm sharp landed; build still ships because GDI stitch is the Windows fallback.
      - name: Verify sharp bundled in Windows app
        working-directory: desktop-agent
        shell: bash
        continue-on-error: true
        run: |
          APP_DIR="dist/win-unpacked"
          test -d "$APP_DIR/resources" || { echo "Missing $APP_DIR/resources"; ls -la dist; exit 1; }
          if [ -d "$APP_DIR/resources/app.asar.unpacked/node_modules/sharp" ] || \
             [ -d "$APP_DIR/resources/app.asar.unpacked/node_modules/@img" ] || \
             find "$APP_DIR/resources" -type d -name 'sharp-win32-*' | grep -q .; then
            echo "OK: sharp / @img present in packaged Windows app"
            find "$APP_DIR/resources" -type d \( -name 'sharp' -o -name 'sharp-win32-*' \) | head -20
          else
            echo "WARN: sharp not found in packaged app — runtime will use System.Drawing stitch"
            find "$APP_DIR/resources" -maxdepth 4 -type d | head -80
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop-agent/dist/*.exe
            desktop-agent/dist/latest.yml
          retention-days: 7

  publish:
    name: Publish Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      # electron-builder writes Alyson-PM in yml but ships Alyson.PM files — patch before publish.
      - name: Fix updater metadata filenames
        run: |
          for f in release-assets/latest-mac.yml release-assets/latest.yml; do
            if [ -f "$f" ]; then
              sed -i.bak 's/Alyson-PM/Alyson.PM/g' "$f"
              rm -f "$f.bak"
              echo "Patched $f"
            fi
          done
          # Windows NSIS ships Alyson.PM.Setup.{version}.exe but yml says Alyson.PM-Setup-{version}.exe
          if [ -f release-assets/latest.yml ]; then
            sed -i.bak 's/Alyson\.PM-Setup-/Alyson.PM.Setup./g' release-assets/latest.yml
            rm -f release-assets/latest.yml.bak
            echo "Aligned Windows exe path in latest.yml"
            cat release-assets/latest.yml
          fi
          # Auto-updater requires ZIP entries only (DMGs break silent updates).
          if [ -f release-assets/latest-mac.yml ]; then
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("release-assets/latest-mac.yml")
          text = p.read_text()
          lines = text.splitlines()
          out, in_files, kept_any, skip_block = [], False, False, False
          for line in lines:
            if line.startswith("files:"):
              in_files = True
              skip_block = False
              out.append(line)
              continue
            if in_files:
              if re.match(r"^  - url: ", line):
                skip_block = ".zip" not in line.lower()
                if not skip_block:
                  out.append(line)
                  kept_any = True
                continue
              if skip_block:
                if line and not line.startswith("  "):
                  in_files = False
                  skip_block = False
                  out.append(line)
                continue
              if re.match(r"^    (sha512|size): ", line):
                out.append(line)
                continue
              if line and not line.startswith("  "):
                in_files = False
                skip_block = False
                out.append(line)
                continue
              continue
            out.append(line)
          if kept_any:
            p.write_text("\n".join(out) + "\n")
            print("Stripped non-ZIP entries from latest-mac.yml")
          print(p.read_text())
          PY
          fi

      - name: Get version
        id: version
        run: |
          # workflow_dispatch sets github.ref_name to the branch (e.g. "main").
          # Prefer the explicit input so we never publish a release tagged "main".
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [[ "$TAG" == refs/heads/* ]]; then
            echo "❌ Refusing to publish release with invalid tag: '${TAG}'"
            echo "For workflow_dispatch, pass inputs.version (e.g. v1.0.218)."
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing release tag: $TAG"

      # Retagging the same version leaves a published shell + draft with assets.
      # Remove all existing releases for this tag so publish is a single clean release.
      - name: Remove duplicate releases for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release list --limit 100 --json databaseId,tagName,isDraft \
            | jq -r --arg t "$TAG" '.[] | select(.tagName == $t) | .databaseId' \
            | while read -r id; do
              echo "Deleting existing release id=$id for tag $TAG"
              gh api -X DELETE "repos/${{ github.repository }}/releases/${id}" || true
            done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **macOS:** In-app update downloads the ZIP and replaces the app in place.
            When this release is signed with the stable self-signed identity, Screen Recording
            and Accessibility permissions persist across future updates (one re-grant may be
            required when first moving from an unsigned build onto this signed build).

            **macOS first install:** Download the DMG for your chip (arm64 = Apple Silicon, x64 = Intel).
            Right-click the app → **Open** if Gatekeeper blocks a double-click, then grant
            **Screen Recording** and **Accessibility** to **Alyson PM**.

            **Windows:** Download the `.exe` Setup installer and run it.
            SmartScreen may warn because the installer is unsigned — **More info** → **Run anyway**.
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
