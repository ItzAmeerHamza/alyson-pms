AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Alyson Time Doctor NestJS API + Screenshot AI pipeline (SQS worker)

# Deploy stack name (you choose at sam deploy): alyson-time-doctor-api-dev
# ECR repository name: alyson-time-doctor-api
# Cost allocation tag on all pipeline resources: team = Alyson PM

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for Lambda functions (shared API + AI workers)
  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Lambda (RDS Proxy access)
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group(s) for VPC Lambdas — RDS Proxy + SQS VPC endpoint access
  VpcId:
    Type: String
    Default: vpc-0b6659ffcf9d60888
    Description: VPC for SQS interface endpoint (API + backfill Lambdas)
  DatabaseHost:
    Type: String
    Description: RDS Proxy hostname
  DatabaseName:
    Type: String
    Default: revclouddb
  DatabaseUser:
    Type: String
    Default: alyson_time_doctor_api
  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Prefer Secrets Manager in production; parameter for dev only
  S3BucketName:
    Type: String
    Description: Private screenshots bucket (existing — not created by this stack)
  S3Prefix:
    Type: String
    Default: alyson-td-screenshots
  AllowedOrigins:
    Type: String
    Default: http://localhost:8080
    Description: Comma-separated CORS origins (matches Nest ALLOWED_ORIGINS)
  InternalApiKey:
    Type: String
    NoEcho: true
    Description: Desktop agent /sync/* authentication
  CognitoRegion:
    Type: String
    Default: us-west-2
  CognitoUserPoolId:
    Type: String
    Description: Cognito user pool for JWT validation
  CognitoClientId:
    Type: String
    Description: Cognito app client id
  DeepseekApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: DeepSeek API key for screenshot vision analysis (worker Lambda only)
  ScreenshotAiEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable SQS enqueue on upload and scheduled backfill
  ScreenshotAiBackfillBatchSize:
    Type: String
    Default: '100'
    Description: Max pending screenshots enqueued per backfill run
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment suffix for alyson-time-doctor resource names (dev, staging, prod)
  SqsVpcEndpointDnsName:
    Type: String
    Description: Regional VPC endpoint DNS hostname (vpce-*.sqs.REGION.vpce.amazonaws.com). Required for VPC Lambdas when PrivateDnsEnabled is false.
  LambdaEndpointSubnetId:
    Type: String
    Description: Subnet for the Lambda interface VPC endpoint (PrivateDnsEnabled stays false). Used so the API can Invoke the Cognito admin worker without NAT.
  EmailFrom:
    Type: String
    Default: hamza@cintara.ai
    Description: Default SES From address (bare email; no display-name — SAM param parsing)
  EmailSenders:
    Type: String
    Default: hamza@cintara.ai,mohita@cintara.ai
    Description: Comma-separated allowlisted SES From addresses for Email Reporting picker

Conditions:
  ScreenshotAiEnabled: !Equals [!Ref ScreenshotAiEnabled, 'true']

Globals:
  Function:
    Timeout: 29
    MemorySize: 1024
    Architectures:
      - arm64
    Tags:
      team: Alyson PM

Resources:
  # --- Screenshot AI pipeline (SQS + worker + backfill cron) ---
  # No NAT: AI worker + Cognito admin run outside VPC (public AWS APIs). API/backfill use
  # SQS/Lambda VPC endpoints + RDS in VPC.
  # NEVER enable PrivateDnsEnabled on shared-VPC endpoints — that hijacks regional DNS for all apps.
  # SDK-only: SQS_VPC_ENDPOINT_URL / LAMBDA_VPC_ENDPOINT_URL point at vpce-*.vpce.amazonaws.com hostnames.
  # Cognito IDP PrivateLink is NOT used: Managed Login / user-pool domains reject AdminCreateUser over it.

  SqsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Alyson Time Doctor - SQS VPC endpoint ingress from VPC Lambdas
      VpcId: !Ref VpcId
      Tags:
        - Key: team
          Value: Alyson PM
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Select [0, !Ref VpcSecurityGroupIds]

  SqsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      VpcId: !Ref VpcId
      SubnetIds: !Ref VpcSubnetIds
      SecurityGroupIds:
        - !Ref SqsEndpointSecurityGroup
      PrivateDnsEnabled: false
      Tags:
        - Key: team
          Value: Alyson PM

  # Lambda Invoke for Cognito admin worker (Team Management). Private DNS MUST stay false.
  LambdaEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Alyson Time Doctor - Lambda VPC endpoint (SDK hostname only; no Private DNS)
      VpcId: !Ref VpcId
      Tags:
        - Key: team
          Value: Alyson PM
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Select [0, !Ref VpcSecurityGroupIds]
          Description: HTTPS from Alyson Time Doctor Lambda SG only

  LambdaVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcId: !Ref VpcId
      SubnetIds:
        - !Ref LambdaEndpointSubnetId
      SecurityGroupIds:
        - !Ref LambdaEndpointSecurityGroup
      PrivateDnsEnabled: false
      Tags:
        - Key: team
          Value: Alyson PM
        - Key: Name
          Value: !Sub 'alyson-time-doctor-lambda-${EnvironmentName}'

  # Outside VPC: public Cognito AdminCreateUser (Managed Login pools block cognito-idp PrivateLink).
  CognitoAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alyson-time-doctor-cognito-admin-${EnvironmentName}'
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - dist/src/lambda/cognito-admin-handler.handler
      Timeout: 29
      MemorySize: 256
      Tags:
        team: Alyson PM
      Environment:
        Variables:
          NODE_ENV: production
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
              Resource: !Sub 'arn:aws:cognito-idp:${CognitoRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # Outside VPC: public SES SendEmail (API Lambda has no NAT; do not add SES VPC endpoints).
  SesEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alyson-time-doctor-ses-email-${EnvironmentName}'
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - dist/src/lambda/ses-email-handler.handler
      Timeout: 29
      MemorySize: 256
      Tags:
        team: Alyson PM
      Environment:
        Variables:
          NODE_ENV: production
          EMAIL_FROM: !Ref EmailFrom
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  ScreenshotAiDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'alyson-time-doctor-screenshot-ai-dlq-${EnvironmentName}'
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: team
          Value: Alyson PM

  ScreenshotAiQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'alyson-time-doctor-screenshot-ai-queue-${EnvironmentName}'
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScreenshotAiDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: team
          Value: Alyson PM

  ScreenshotAiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alyson-time-doctor-screenshot-ai-worker-${EnvironmentName}'
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - dist/src/lambda/screenshot-ai-worker-handler.handler
      Timeout: 300
      MemorySize: 1024
      Tags:
        team: Alyson PM
      Environment:
        Variables:
          NODE_ENV: production
          AWS_S3_SCREENSHOTS_BUCKET: !Ref S3BucketName
          AWS_S3_SCREENSHOTS_PREFIX: !Ref S3Prefix
          DEEPSEEK_API_KEY: !Ref DeepseekApiKey
          SCREENSHOT_AI_ENABLED: !Ref ScreenshotAiEnabled
          SCREENSHOT_AI_API_BASE_URL: !Sub 'https://${AlysonTimeDoctorHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
          INTERNAL_API_KEY: !Ref InternalApiKey
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
                - rekognition:DetectLabels
              Resource: '*'
      Events:
        ScreenshotAiQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ScreenshotAiQueue.Arn
            BatchSize: 1
            Enabled: true
            ScalingConfig:
              MaximumConcurrency: 5

  ScreenshotAiBackfillFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'alyson-time-doctor-screenshot-ai-backfill-${EnvironmentName}'
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - dist/src/lambda/screenshot-ai-backfill-handler.handler
      Timeout: 120
      MemorySize: 512
      Tags:
        team: Alyson PM
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_USER: !Ref DatabaseUser
          DATABASE_PASSWORD: !Ref DatabasePassword
          DATABASE_SSL: 'true'
          DATABASE_SSL_REJECT_UNAUTHORIZED: 'false'
          DATABASE_POOL_MAX: '2'
          SCREENSHOT_AI_QUEUE_URL: !Ref ScreenshotAiQueue
          SCREENSHOT_AI_ENABLED: !Ref ScreenshotAiEnabled
          SCREENSHOT_AI_BACKFILL_BATCH_SIZE: !Ref ScreenshotAiBackfillBatchSize
          SQS_VPC_ENDPOINT_URL: !Sub 'https://${SqsVpcEndpointDnsName}'
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScreenshotAiQueue.QueueName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
              Resource: '*'
      Events:
        BackfillSchedule:
          Type: Schedule
          Properties:
            Name: !Sub 'alyson-time-doctor-screenshot-ai-backfill-schedule-${EnvironmentName}'
            Schedule: rate(5 minutes)
            Enabled: !If [ScreenshotAiEnabled, true, false]
            Description: Alyson Time Doctor - enqueue pending screenshots for AI analysis

  AlysonTimeDoctorApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Tags:
        team: Alyson PM
      Environment:
        Variables:
          NODE_ENV: production
          SERVERLESS_MODE: '1'
          DISABLE_GRAPHQL: '1'
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_USER: !Ref DatabaseUser
          DATABASE_PASSWORD: !Ref DatabasePassword
          DATABASE_SSL: 'true'
          DATABASE_POOL_MAX: '2'
          AWS_S3_SCREENSHOTS_BUCKET: !Ref S3BucketName
          AWS_S3_SCREENSHOTS_PREFIX: !Ref S3Prefix
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          INTERNAL_API_KEY: !Ref InternalApiKey
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          # Non-VPC Cognito admin worker + Lambda Invoke over VPC endpoint (PrivateDnsEnabled=false).
          # DnsEntries GetAtt entries are "HostedZoneId:DnsName".
          COGNITO_ADMIN_FUNCTION_NAME: !Ref CognitoAdminFunction
          SES_EMAIL_FUNCTION_NAME: !Ref SesEmailFunction
          EMAIL_FROM: !Ref EmailFrom
          EMAIL_SENDERS: !Ref EmailSenders
          LAMBDA_VPC_ENDPOINT_URL: !Join
            - ''
            - - 'https://'
              - !Select
                - 1
                - !Split
                  - ':'
                  - !Select [0, !GetAtt LambdaVpcEndpoint.DnsEntries]
          DATABASE_SSL_REJECT_UNAUTHORIZED: 'false'
          SCREENSHOT_AI_QUEUE_URL: !Ref ScreenshotAiQueue
          SCREENSHOT_AI_ENABLED: !Ref ScreenshotAiEnabled
          SQS_VPC_ENDPOINT_URL: !Sub 'https://${SqsVpcEndpointDnsName}'
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScreenshotAiQueue.QueueName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
              Resource: '*'
        # Invoke non-VPC workers (Cognito admin + SES email) via Lambda VPC endpoint.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt CognitoAdminFunction.Arn
                - !GetAtt SesEmailFunction.Arn
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AlysonTimeDoctorHttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AlysonTimeDoctorHttpApi
            Path: /
            Method: ANY

  AlysonTimeDoctorHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Tags:
        team: Alyson PM
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
          - x-api-key
        AllowCredentials: true
      # Auth is enforced in Nest (Cognito JWT + INTERNAL_API_KEY for /sync).
      # Do not set a default API Gateway JWT authorizer — it would block /sync/desktop-action.

Outputs:
  ApiEndpoint:
    Description: HTTP API base URL (no trailing slash)
    Value: !Sub 'https://${AlysonTimeDoctorHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AlysonTimeDoctorApiFunction.Arn
  ScreenshotAiQueueUrl:
    Description: SQS queue URL for screenshot AI jobs
    Value: !Ref ScreenshotAiQueue
  ScreenshotAiWorkerFunctionArn:
    Description: Screenshot AI worker Lambda ARN
    Value: !GetAtt ScreenshotAiWorkerFunction.Arn
  ScreenshotAiBackfillFunctionArn:
    Description: Screenshot AI backfill Lambda ARN
    Value: !GetAtt ScreenshotAiBackfillFunction.Arn
  SqsVpcEndpointDnsName:
    Description: Regional SQS VPC endpoint DNS (Private DNS disabled — app SDK only)
    Value: !Ref SqsVpcEndpointDnsName
  CognitoAdminFunctionArn:
    Description: Non-VPC Cognito AdminCreateUser/AdminDeleteUser worker
    Value: !GetAtt CognitoAdminFunction.Arn
  SesEmailFunctionArn:
    Description: Non-VPC SES SendEmail worker (low-hours / transactional)
    Value: !GetAtt SesEmailFunction.Arn
  LambdaVpcEndpointDnsName:
    Description: Lambda VPC endpoint DNS (Private DNS disabled — app SDK only)
    Value: !Select
      - 1
      - !Split
        - ':'
        - !Select [0, !GetAtt LambdaVpcEndpoint.DnsEntries]
