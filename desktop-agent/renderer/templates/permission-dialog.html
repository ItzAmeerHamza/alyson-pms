<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      background: #FFA500;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      margin: 0 0 25px 0;
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .permission-item {
      display: flex;
      align-items: center;
      margin: 15px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .permission-icon {
      width: 40px;
      height: 40px;
      background: #007AFF;
      border-radius: 8px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    .permission-text {
      text-align: left;
      flex: 1;
    }
    .permission-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }
    .permission-desc {
      font-size: 12px;
      color: #666;
    }
    .step-indicator {
      font-size: 12px;
      color: #999;
      margin: 20px 0 10px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .primary {
      background: #007AFF;
      color: white;
    }
    .primary:hover {
      background: #0066CC;
    }
    .secondary {
      background: #f0f0f0;
      color: #333;
    }
    .secondary:hover {
      background: #e0e0e0;
    }
    .checkmark {
      color: #4CAF50;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h2>Turn on screenshots</h2>
    <p>You need to allow the TimeFlow app to record your screen to track time to this project.</p>
    
    <div class="permission-item">
      <div class="permission-icon">🖥️</div>
      <div class="permission-text">
        <div class="permission-title">Screen Recording</div>
        <div class="permission-desc">Required to capture app usage and screenshots</div>
      </div>
    </div>
    
    <div class="step-indicator">
      <span class="checkmark">✓</span> Check the box next to TimeFlow
    </div>
    
    <p style="font-size: 12px; color: #999;">
      You will need to restart TimeFlow afterwards for the change to take effect.
    </p>
    
    <div class="buttons">
      <button class="secondary" onclick="skip()">Not now</button>
      <button class="primary" onclick="openSettings()">Continue</button>
    </div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    function openSettings() {
      ipcRenderer.send('permission-action', 'open-settings');
    }
    
    function skip() {
      ipcRenderer.send('permission-action', 'skip');
    }
  </script>
</body>
</html>
