<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock circle -->
  <circle cx="11" cy="11" r="9" fill="none" stroke="black" stroke-width="2"/>
  <!-- Hour hand pointing to 3 -->
  <line x1="11" y1="11" x2="16" y2="11" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="11" y1="11" x2="11" y2="5" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="11" cy="11" r="1.5" fill="black"/>
</svg>











